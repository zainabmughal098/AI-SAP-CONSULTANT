<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP Consultant</title>
  <link rel="icon" type="image/png" href="/static/assets/sap_logo.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400;6..144,500;6..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=3" />
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn brand-btn" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar">
          <img src="/static/assets/sap_logo.png?v=2" alt="SAP" class="brand-logo" />
        </button>
        <span class="brand-name">Consultant</span>
      </div>

      <button class="sidebar-action" id="new-chat-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>New chat</span>
      </button>

      <div class="sidebar-section">
        <div class="sidebar-label">Recent</div>
        <div class="recent-list" id="recent-list"></div>
      </div>

      <div class="sidebar-footer">
        <button class="icon-btn" id="clear-chat-btn" title="Clear conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>
          </svg>
        </button>
        <div class="status-dot" title="Online"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-spacer"></div>
        <div class="model-badge">Grounded RAG</div>
      </header>

      <section class="chat-stage" id="chat-stage">
        <div class="welcome" id="welcome">
          <h1 class="welcome-title" id="welcome-title">Any new ideas to explore?</h1>
          <p class="welcome-subtitle">Ask about SAP transaction codes, errors, issues, and business processes.</p>
        </div>
        <div class="messages" id="messages" hidden>
          <div class="messages-inner" id="messages-inner"></div>
        </div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="composer-form">
          <button type="button" class="composer-icon" title="New chat" id="composer-new">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <textarea
            id="query-input"
            rows="1"
            placeholder="Ask SAP Consultant"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <div class="composer-actions">
            <span class="composer-model">Expert</span>
            <button type="submit" class="send-btn" id="send-btn" aria-label="Send message">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M3.4 20.6 21 12 3.4 3.4l2.8 7.2L17 12l-10.8 1.4-2.8 7.2z"/>
              </svg>
            </button>
            <button type="button" class="stop-btn hidden" id="stop-btn" aria-label="Stop generating">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="1"/>
              </svg>
            </button>
          </div>
        </form>
        <p class="disclaimer">SAP Consultant uses your knowledge base. Verify critical SAP steps before production use.</p>
      </footer>
    </main>
  </div>

  <script src="/static/js/background.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
